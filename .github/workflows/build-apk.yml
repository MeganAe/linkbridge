name: Construire l'APK Android

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    name: Build debug
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v4

      - name: Accepter les licences Android
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Exécuter les tests unitaires
        run: gradle --no-daemon --max-workers=2 :core:test :app:testDebugUnitTest

      - name: Compiler l'APK debug
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug

      - name: Publier l'APK comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkBridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
