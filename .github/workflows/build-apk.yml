name: Construire l'APK Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build debug
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v4

      - name: Accepter les licences Android
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Exécuter les tests unitaires
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Compiler l'APK debug
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug

      - name: Publier l'APK comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkBridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publier une release GitHub
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: LinkBridge v${{ github.run_number }}
          body: |
            Build automatique depuis GitHub Actions (déclenché manuellement).

            - Tests unitaires : passés
            - APK debug compilé et prêt à tester
            - À installer sur deux téléphones pour vérifier le partage Internet par Wi‑Fi Direct
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
